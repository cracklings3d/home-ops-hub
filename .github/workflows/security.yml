name: Security & Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Check for vulnerable packages
        run: |
          cd backend
          pip install -r requirements.txt -q
          pip-audit -r requirements.txt || true

      - name: Check for outdated packages
        run: |
          cd backend
          pip install pip-check-updates
          pcu -r requirements.txt --output-format table || echo "pc-updates check done"

  flutter-deps:
    name: Flutter dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true, cache-dependency-path: frontend/pubspec.lock }

      - name: Check outdated packages
        run: |
          cd frontend
          flutter pub outdated --json | tee outdated.json
          # Fail if major version updates available
          if grep -q '"isMajor":true' outdated.json 2>/dev/null; then
            echo "WARNING: Major version updates available. Review outdated.json"
          fi

  secrets-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@0.5.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python quality
        run: |
          pip install ruff
          cd backend
          ruff check . --output-format=github

      - name: Flutter quality
        uses: subosito/flutter-action@v2
        with: { channel: stable }
        with:
          run: |
            cd frontend
            flutter analyze --no-fatal-infos --reporter=github

  docker-security:
    name: Docker security scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Django image
        run: |
          cd infrastructure/docker/django
          docker build -t home-ops-hub:django-test .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: home-ops-hub:django-test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-results.sarif }

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            // Dependency Review Action is built-in on public repos
            // This step documents the check
            console.log('Dependency review enabled via GitHub settings')