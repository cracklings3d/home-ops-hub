name: home_ops_hub
description: 家庭资产管理系统 - 追踪说明书、文档、维修记录、耗材采购
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # HTTP & API
  dio: ^5.8.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # UI Components
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2

  # Forms & Validation
  flutter_form_builder: ^9.5.0
  form_builder_validators: ^11.1.0

  # QR Code
  mobile_scanner: ^6.0.5
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.3

  # Charts & Visualization
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  hive_generator: ^2.0.1
  bloc_test: ^10.0.0
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700